<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE BLOCK 105 RADIO - Cue Sheet Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #1f1f1f;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        .station-title {
            text-align: center;
            color: #ffcc00;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .steps {
            text-align: center;
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 45px;
        }

        .steps span {
            color: #ffcc00;
            margin: 0 7px;
        }

        .main-title {
            color: #ffffff;
            font-size: 30px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 35px;
        }

        .form-card {
            background: #252525;
            border: 2px solid #ffcc00;
            border-radius: 12px;
            padding: 30px;
        }

        label {
            display: block;
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #666;
            background: #111111;
            color: #ffffff;
            font-size: 17px;
            margin-bottom: 25px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ffcc00;
        }

        .file-box {
            width: 100%;
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #666;
            background: #111111;
            margin-bottom: 28px;
        }

        input[type="file"] {
            width: 100%;
            color: #ffffff;
            font-size: 15px;
        }

        .generate-button,
        .download-button {
            display: block;
            width: 100%;
            border: none;
            border-radius: 9px;
            background: #ffcc00;
            color: #000000;
            font-size: 20px;
            font-weight: 900;
            padding: 18px 20px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .generate-button:hover,
        .download-button:hover {
            background: #ffd633;
        }

        .generate-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-box {
            display: none;
            margin-top: 30px;
            padding: 22px;
            border-radius: 9px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
        }

        .processing {
            background: #292929;
            border: 1px solid #666;
            color: #ffffff;
        }

        .success {
            background: #073b1f;
            border: 2px solid #28c76f;
            color: #ffffff;
        }

        .success-check {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #28c76f;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 900;
        }

        .success-message {
            font-size: 24px;
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 25px;
        }

        .error {
            background: #4a1111;
            border: 2px solid #ff5555;
            color: #ffffff;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 12px 40px;
            }

            .station-title {
                font-size: 28px;
            }

            .steps {
                font-size: 13px;
                line-height: 1.8;
            }

            .main-title {
                font-size: 23px;
            }

            .form-card {
                padding: 20px;
            }

            .success-message {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="station-title">
        THE BLOCK 105 RADIO
    </div>

    <div class="steps">
        SHOW TITLE
        <span>*</span>
        UPLOAD AUDIO FILE
        <span>*</span>
        GENERATE CUE SHEET
        <span>*</span>
        DOWNLOAD
    </div>

    <div class="main-title">
        GENERATE YOUR BLOCK 105 RADIO CUE SHEET
    </div>

    <div id="formCard" class="form-card">

        <form id="cueSheetForm">

            <label for="showTitle">
                SHOW TITLE
            </label>

            <input
                type="text"
                id="showTitle"
                name="show_title"
                placeholder="Enter your show title"
                required
            >

            <label for="audioFile">
                UPLOAD AUDIO FILE
            </label>

            <div class="file-box">
                <input
                    type="file"
                    id="audioFile"
                    name="audio"
                    accept="audio/*"
                    required
                >
            </div>

            <button
                type="submit"
                id="generateButton"
                class="generate-button"
            >
                GENERATE CUE SHEET
            </button>

        </form>

    </div>

    <div
        id="processingBox"
        class="status-box processing"
    >
        GENERATING YOUR CUE SHEET...<br><br>
        PLEASE WAIT.
    </div>

    <div
        id="successBox"
        class="status-box success"
    >

        <div class="success-check">
            ✓
        </div>

        <div class="success-message">
            THE BLOCK 105 RADIO CUE SHEET<br>
            GENERATED SUCCESSFULLY
        </div>

        <a
            id="downloadButton"
            class="download-button"
            href="#"
        >
            DOWNLOAD CUE SHEET!
        </a>

    </div>

    <div
        id="errorBox"
        class="status-box error"
    >
        <div id="errorMessage"></div>
    </div>

</div>

<script>

const form = document.getElementById("cueSheetForm");
const formCard = document.getElementById("formCard");
const generateButton = document.getElementById("generateButton");
const processingBox = document.getElementById("processingBox");
const successBox = document.getElementById("successBox");
const errorBox = document.getElementById("errorBox");
const errorMessage = document.getElementById("errorMessage");
const downloadButton = document.getElementById("downloadButton");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    errorBox.style.display = "none";
    successBox.style.display = "none";

    const showTitle =
        document.getElementById("showTitle").value.trim();

    const audioFile =
        document.getElementById("audioFile").files[0];

    if (!showTitle) {
        showError("PLEASE ENTER YOUR SHOW TITLE.");
        return;
    }

    if (!audioFile) {
        showError("PLEASE SELECT YOUR FULL RADIO SHOW AUDIO FILE.");
        return;
    }

    const formData = new FormData();

    formData.append("show_title", showTitle);
    formData.append("audio", audioFile);

    generateButton.disabled = true;
    generateButton.textContent = "GENERATING...";

    formCard.classList.add("hidden");
    processingBox.style.display = "block";

    try {

        const response = await fetch(
            "/analyze",
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Unable to generate the cue sheet."
            );
        }

        if (!data.job_id) {
            throw new Error(
                "The system did not return a job ID."
            );
        }

        checkStatus(data.job_id);

    } catch (error) {

        showError(error.message);

        formCard.classList.remove("hidden");
        processingBox.style.display = "none";

        generateButton.disabled = false;
        generateButton.textContent = "GENERATE CUE SHEET";
    }

});


async function checkStatus(jobId) {

    try {

        const response = await fetch(
            "/status/" + jobId
        );

        const job = await response.json();

        if (!response.ok) {
            throw new Error(
                job.error ||
                "Unable to check cue sheet status."
            );
        }

        if (job.status === "complete") {

            processingBox.style.display = "none";
            successBox.style.display = "block";

            const downloadUrl =
                job.download ||
                "/download/" + jobId;

            /*
             * Store the working Railway download URL.
             */
            downloadButton.dataset.downloadUrl =
                downloadUrl;

            /*
             * When embedded in GoDaddy, send the URL
             * to the parent page so the parent can perform
             * the top-level navigation/download.
             */
            downloadButton.onclick = function(event) {

                event.preventDefault();

                const url =
                    downloadButton.dataset.downloadUrl;

                if (window.parent !== window) {

                    window.parent.postMessage(
                        {
                            type: "BLOCK105_DOWNLOAD",
                            url: url
                        },
                        "*"
                    );

                } else {

                    window.location.href = url;

                }

            };

            return;
        }

        if (job.status === "error") {

            throw new Error(
                job.message ||
                "The cue sheet could not be generated."
            );
        }

        setTimeout(
            function() {
                checkStatus(jobId);
            },
            2000
        );

    } catch (error) {

        showError(error.message);

        formCard.classList.remove("hidden");
        processingBox.style.display = "none";

        generateButton.disabled = false;
        generateButton.textContent = "GENERATE CUE SHEET";
    }

}


function showError(message) {

    errorMessage.textContent = message;
    errorBox.style.display = "block";

}

</script>

</body>
</html>
